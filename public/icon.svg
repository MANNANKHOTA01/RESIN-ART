<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="resinGrad" x1="64" y1="64" x2="448" y2="448" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#0d9488" />
      <stop offset="80%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <radialGradient id="dropletGlow" cx="256" cy="200" r="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="60%" stop-color="#0d9488" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#042f2e" stop-opacity="0.95" />
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Canvas Base -->
  <rect width="512" height="512" rx="112" fill="#091424" />

  <!-- Fluid Resin Wave & Droplet Motif -->
  <path d="M256 64 C 340 160, 420 240, 420 330 C 420 420, 346 456, 256 456 C 166 456, 92 420, 92 330 C 92 240, 172 160, 256 64 Z" fill="url(#dropletGlow)" />
  
  <!-- Swirling Flow Layer -->
  <path d="M128 340 C 160 380, 220 400, 280 370 C 340 340, 390 350, 412 330 C 418 360, 390 410, 340 434 C 280 460, 190 440, 140 390 C 120 370, 122 350, 128 340 Z" fill="#38bdf8" opacity="0.45" />

  <!-- Sea Foam Lacing Crest Curve -->
  <path d="M150 290 Q 230 350, 320 280 T 390 320" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.85" filter="url(#softGlow)" />
  <circle cx="210" cy="318" r="6" fill="#ffffff" opacity="0.9" />
  <circle cx="240" cy="330" r="4" fill="#ffffff" opacity="0.75" />
  <circle cx="270" cy="312" r="5" fill="#ffffff" opacity="0.85" />
  <circle cx="340" cy="296" r="4" fill="#ffffff" opacity="0.8" />

  <!-- Translucent Light Sheen -->
  <path d="M210 130 C 235 90, 256 90, 266 110 C 240 180, 170 250, 150 300 C 145 280, 175 190, 210 130 Z" fill="#ffffff" opacity="0.35" />
</svg>
